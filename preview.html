<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>田信忠 · 论文在线预览</title>
<style>
  :root { --navy:#1B3A66; --blue:#2E5496; --ink:#23272E; --sub:#71767F; --line:#D3DAE4; --panel:#F7F9FC; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif; color:var(--ink);
         background:#F2F4F8; line-height:1.6; }
  header { background:#fff; border-bottom:2px solid var(--navy); padding:22px 24px; }
  .wrap { max-width:960px; margin:0 auto; padding:26px 20px 56px; }
  header .wrap { padding:0; }
  h1 { font-size:20px; color:var(--navy); letter-spacing:1.5px; }
  h1 span { display:block; font-size:12px; color:var(--sub); letter-spacing:1.4px; font-weight:400; margin-top:5px; }
  .note { background:var(--panel); border:.6px solid var(--line); border-left:3px solid var(--blue);
          padding:11px 15px; font-size:13px; color:#4B5563; margin:0 0 22px; }
  .note b { color:var(--navy); }
  h2 { font-size:13.5px; color:var(--navy); letter-spacing:1.2px; margin:0 0 10px; }
  ul { list-style:none; background:#fff; border:.6px solid var(--line); }
  li { padding:12px 16px; border-bottom:.6px solid var(--line); cursor:pointer; display:flex;
       justify-content:space-between; gap:14px; align-items:flex-start; }
  li:last-child { border-bottom:none; }
  li:hover { background:var(--panel); }
  li.on { background:#EEF3FA; box-shadow:inset 3px 0 0 var(--blue); }
  .t { font-size:13.5px; font-weight:600; }
  .m { font-size:12px; color:var(--sub); margin-top:3px; }
  .go { font-size:12px; color:var(--blue); white-space:nowrap; padding-top:2px; }
  .viewer { background:#fff; border:.6px solid var(--line); margin-top:22px; }
  .bar { display:flex; align-items:center; gap:9px; padding:10px 14px; border-bottom:.6px solid var(--line); flex-wrap:wrap; }
  .bar .name { font-size:13px; font-weight:600; flex:1; min-width:180px; overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap; }
  button, a.btn { font:inherit; font-size:12.5px; color:var(--navy); background:#fff; border:.8px solid #C6D2E4;
           border-radius:3px; padding:3px 10px; cursor:pointer; text-decoration:none; display:inline-block; }
  button:disabled { color:#AFB6C2; border-color:#E0E5ED; cursor:default; }
  #pinfo { font-size:12.5px; color:var(--sub); min-width:92px; text-align:center; }
  #stage { padding:12px; text-align:center; min-height:360px; }
  canvas { max-width:100%; box-shadow:0 1px 6px rgba(0,0,0,.12); background:#fff; }
  .hint { color:var(--sub); font-size:13px; padding:52px 0; }
  footer { text-align:center; color:var(--sub); font-size:12.5px; letter-spacing:1px; margin-top:26px; }
</style>
</head>
<body>
<header>
  <div class="wrap"><h1>田信忠 · 论文在线预览<span>RESEARCH PAPERS · ONLINE PREVIEW</span></h1></div>
</header>

<div class="wrap">
  <div class="note">
    下列为<b>未发表论文的预览版</b>：摘要结论、图表与回归表、结论章节<b>已隐去</b>，保留标题、作者、
    研究背景与文献综述、研究假设、变量定义与模型设定。<b>点击论文标题即可在本页直接阅读全文</b>，也可按需下载。
  </div>

  <h2>论文列表</h2>
  <ul id="list"></ul>

  <div class="viewer">
    <div class="bar">
      <span class="name" id="cur">—</span>
      <button id="prev" disabled>上一页</button>
      <span id="pinfo"></span>
      <button id="next" disabled>下一页</button>
      <button id="zoomout" disabled>缩小</button>
      <button id="zoomin" disabled>放大</button>
      <a class="btn" id="dl" href="#" target="_blank" rel="noopener">下载 PDF</a>
    </div>
    <div id="stage"><div class="hint">正在载入…</div></div>
  </div>

  <footer>田信忠 · 金融数据分析 / 行业研究 · imxzt@qq.com</footer>
</div>

<script src="https://imxzt-papers.oss-cn-shenzhen.aliyuncs.com/pdfjs/pdf.min.js"></script>
<script>
const OSS   = "https://imxzt-papers.oss-cn-shenzhen.aliyuncs.com/";       // 快：国内节点（下载用）
const PAGES = "https://imxzt.github.io/research-papers/";                  // 同源兜底（预览用）
const PAPERS = [
  { t:"数字贸易协议对全球价值链前向参与度的影响研究——来自 RCEP 国家的证据",
    m:"方冬莉、田信忠、张皓彦、苏梦颖 · 广西民族大学经济学院 · 投稿《国际贸易问题》等期刊",
    f:"02-digital-trade-agreements-and-gvc-forward-participation.pdf" },
  { t:"贸易协定深度对绿色全要素生产率的影响研究——来自 RCEP 国家的证据",
    m:"李政、田信忠、张皓彦 · 区域贸易协定深度与绿色全要素生产率",
    f:"04-rta-depth-and-green-tfp.pdf" },
  { t:"数字普惠金融提高了农村居民收入吗？——来自 285 个城市的经验证据",
    m:"田信忠 · 2011–2022 年中国 285 个地级及以上城市面板数据 · 投稿 Agriculture 等期刊",
    f:"01-digital-financial-inclusion-and-rural-income.pdf" },
  { t:"Extreme Weather Shocks and Rural Household Income in China: The Buffering Role of Digital Financial Inclusion and Spatial Spillover Effects",
    m:"极端天气冲击与农村收入——数字金融缓冲作用 · 英文工作论文",
    f:"03-extreme-weather-shocks-rural-income-and-digital-finance.pdf" }
];
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = OSS + "pdfjs/pdf.worker.min.js";

const listEl = document.getElementById('list'), stage = document.getElementById('stage');
const curEl = document.getElementById('cur'), pinfo = document.getElementById('pinfo');
const btnPrev = document.getElementById('prev'), btnNext = document.getElementById('next');
const btnIn = document.getElementById('zoomin'), btnOut = document.getElementById('zoomout'), btnDl = document.getElementById('dl');
let doc = null, page = 1, idx = -1, busy = false, zoom = 1;

PAPERS.forEach((p, i) => {
  const li = document.createElement('li');
  li.innerHTML = '<div><div class="t">' + p.t + '</div><div class="m">' + p.m + '</div></div>' +
                 '<div class="go">在线阅读 ›</div>';
  li.onclick = () => open(i);
  listEl.appendChild(li);
});

function mark() {
  [...listEl.children].forEach((el, i) => el.classList.toggle('on', i === idx));
}
function setNav() {
  pinfo.textContent = doc ? ('第 ' + page + ' / ' + doc.numPages + ' 页') : '';
  btnPrev.disabled = !doc || page <= 1;
  btnNext.disabled = !doc || page >= doc.numPages;
  btnIn.disabled = btnOut.disabled = !doc;
}

async function open(i) {
  idx = i; mark(); zoom = 1;
  curEl.textContent = PAPERS[i].t;
  btnDl.href = OSS + PAPERS[i].f;
  stage.innerHTML = '<div class="hint">正在载入并解析 PDF…</div>';
  doc = null; setNav();
  const urls = [OSS + PAPERS[i].f, PAGES + PAPERS[i].f];
  let lastErr = null;
  for (const u of urls) {
    try { doc = await pdfjsLib.getDocument({ url: u }).promise; break; }
    catch (e) { lastErr = e; doc = null; }
  }
  if (!doc) { stage.innerHTML = '<div class="hint">载入失败：' + (lastErr && lastErr.message || lastErr) + '</div>'; return; }
  page = 1;
  await render();
}

async function render() {
  if (!doc || busy) return;
  busy = true;
  try {
    const pg = await doc.getPage(page);
    const v1 = pg.getViewport({ scale: 1 });
    const maxW = Math.min(stage.clientWidth - 26, 900);
    const vp = pg.getViewport({ scale: (maxW / v1.width) * zoom });
    const cv = document.createElement('canvas');
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    cv.style.maxWidth = 'none';
    stage.innerHTML = ''; stage.appendChild(cv);
    cv.style.display = 'block'; cv.style.margin = '0 auto';
    await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    if (zoom > 1) { stage.style.overflowX = 'auto'; } else { stage.style.overflowX = 'hidden'; }
    setNav();
  } finally { busy = false; }
}

btnPrev.onclick = () => { if (doc && page > 1) { page--; render(); } };
btnNext.onclick = () => { if (doc && page < doc.numPages) { page++; render(); } };
btnIn.onclick  = () => { if (doc && zoom < 2.5) { zoom += 0.25; render(); } };
btnOut.onclick = () => { if (doc && zoom > 0.5) { zoom -= 0.25; render(); } };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  btnPrev.click();
  if (e.key === 'ArrowRight') btnNext.click();
});

if (window.pdfjsLib) open(0);
else stage.innerHTML = '<div class="hint">PDF 组件加载失败（pdf.js）。</div>';
</script>
</body>
</html>
