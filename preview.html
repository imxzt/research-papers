<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>田信忠 · 论文与研究材料</title>
<style>
  :root{
    --navy:#16304F; --blue:#2B5EA7; --blue-soft:#EAF0F9;
    --ink:#1F242B; --sub:#6B7280; --faint:#9AA3AF;
    --line:#E6EAF1; --line-2:#D8DEE9; --panel:#F7F9FC; --stage:#EDF0F5;
    --serif:"Songti SC","SimSun",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    color:var(--ink);background:#fff;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue);text-decoration:none}

  /* ── 页头 ───────────────────────────── */
  .top{border-bottom:1px solid var(--line);background:#fff}
  .top-in{max-width:1180px;margin:0 auto;padding:30px 28px 24px;
          display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand h1{font-family:var(--serif);font-size:27px;font-weight:400;color:var(--navy);
            letter-spacing:6px;line-height:1.2}
  .brand p{margin-top:8px;font-size:12px;color:var(--faint);letter-spacing:2.4px}
  .brand p b{font-weight:400;color:var(--sub);letter-spacing:2.2px}
  .contact{font-size:12.5px;color:var(--sub);letter-spacing:.4px;text-align:right}
  .contact a{color:var(--sub);border-bottom:1px solid var(--line-2);padding-bottom:1px}
  .contact a:hover{color:var(--blue);border-color:var(--blue)}

  /* ── 版面 ───────────────────────────── */
  .wrap{max-width:1180px;margin:0 auto;padding:26px 28px 40px}
  .note{
    display:flex;gap:11px;align-items:flex-start;
    background:var(--panel);border:1px solid var(--line);border-radius:2px;
    padding:13px 16px;margin-bottom:26px;
  }
  .note svg{flex:none;margin-top:2px;color:var(--blue)}
  .note p{font-size:12.8px;color:#4B5563;line-height:1.7}
  .note b{color:var(--navy);font-weight:600}
  .note .dot{color:var(--faint);margin:0 5px}

  .layout{display:grid;grid-template-columns:352px minmax(0,1fr);gap:26px;align-items:start}

  /* ── 目录 ───────────────────────────── */
  .side-head{
    display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:9px;margin-bottom:2px;border-bottom:1.5px solid var(--navy);
  }
  .side-head h2{font-family:var(--serif);font-size:14px;font-weight:400;
                color:var(--navy);letter-spacing:3px}
  .side-head span{font-size:11.5px;color:var(--faint);letter-spacing:.6px}
  #list{list-style:none}

  li.ghead{
    font-family:var(--serif);font-size:12.5px;color:var(--navy);letter-spacing:2px;
    padding:16px 2px 6px;cursor:default;
  }
  li.ghead:first-child{padding-top:8px}
  li.ghead::before{
    content:"";display:inline-block;width:12px;height:1px;background:var(--blue);
    vertical-align:3.5px;margin-right:8px;
  }

  li.paper{
    position:relative;padding:9px 26px 9px 11px;cursor:pointer;border-radius:2px;
    transition:background .16s ease;
  }
  li.paper::before{
    content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;
    background:transparent;border-radius:1px;transition:background .16s ease;
  }
  li.paper:hover{background:var(--panel)}
  li.paper:hover::before{background:var(--line-2)}
  li.paper.on{background:var(--blue-soft)}
  li.paper.on::before{background:var(--blue)}
  li.paper .t{font-size:13.4px;font-weight:600;line-height:1.5;color:var(--ink);
              display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  li.paper.on .t{color:var(--navy)}
  li.paper .m{font-size:11.8px;color:var(--sub);margin-top:4px;line-height:1.55;
              display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  li.paper .go{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    color:var(--line-2);transition:color .16s ease,transform .16s ease;
  }
  li.paper:hover .go{color:var(--blue);transform:translateY(-50%) translateX(2px)}
  li.paper.on .go{color:var(--blue)}

  /* ── 阅读器 ─────────────────────────── */
  .viewer{border:1px solid var(--line);border-radius:2px;overflow:hidden;background:#fff;
          position:sticky;top:18px}
  .bar{
    display:flex;align-items:center;gap:6px;padding:9px 12px;
    border-bottom:1px solid var(--line);background:#fff;
  }
  .bar .name{
    flex:1;min-width:0;font-size:12.6px;font-weight:600;color:var(--navy);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .grp{display:flex;align-items:center;gap:2px}
  .grp + .grp{margin-left:4px;padding-left:8px;border-left:1px solid var(--line)}
  .ib{
    display:inline-flex;align-items:center;justify-content:center;
    width:29px;height:29px;border:none;background:transparent;border-radius:2px;
    color:var(--sub);cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .ib:hover:not(:disabled){background:var(--panel);color:var(--navy)}
  .ib:disabled{color:#CBD2DD;cursor:default}
  .ib svg{display:block}
  #pinfo{font-size:12.2px;color:var(--sub);min-width:56px;text-align:center;
         font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .dl{
    display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 11px;
    font-size:12.2px;color:var(--navy);border:1px solid var(--line-2);border-radius:2px;
    background:#fff;transition:border-color .15s ease,color .15s ease,background .15s ease;
  }
  .dl:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

  #stage{
    background:var(--stage);padding:16px;text-align:center;
    min-height:420px;max-height:calc(100vh - 128px);overflow:auto;
  }
  canvas{background:#fff;box-shadow:0 1px 3px rgba(22,48,79,.10),0 6px 20px rgba(22,48,79,.07);
         display:block;margin:0 auto;border-radius:1px}
  .hint{color:var(--sub);font-size:12.8px;padding:150px 0;letter-spacing:.4px}

  footer{
    margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-size:11.8px;color:var(--faint);letter-spacing:.5px;
  }
  footer .kbd{color:var(--sub)}

  /* ── 响应式 ─────────────────────────── */
  @media (max-width:960px){
    .layout{grid-template-columns:1fr;gap:22px}
    .viewer{position:static}
    #stage{max-height:none}
    .top-in,.wrap{padding-left:20px;padding-right:20px}
    .brand h1{font-size:23px;letter-spacing:4px}
  }
  @media (max-width:520px){
    .bar{flex-wrap:wrap;gap:4px}
    .bar .name{flex-basis:100%;white-space:normal}
    .grp + .grp{margin-left:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>田信忠</h1>
      <p><b>论文与研究材料</b> · 在线预览</p>
    </div>
    <div class="contact"><a href="mailto:imxzt@qq.com">imxzt@qq.com</a></div>
  </div>
</header>

<div class="wrap">
  <div class="note">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.1"/></svg>
    <p>
      下列为<b>未发表论文与研究材料</b>的预览版：<b>摘要结论句与结论章节已隐去</b>，保留标题、作者、
      研究背景与文献综述、研究假设、变量定义与模型设定，以及<b>公式、图表与回归表</b>。
      <span class="dot">·</span>点击左侧标题即可在本页直接阅读，亦可按需下载原件。
    </p>
  </div>

  <div class="layout">
    <aside>
      <div class="side-head"><h2>目录</h2><span id="cnt"></span></div>
      <ul id="list"></ul>
    </aside>

    <section class="viewer">
      <div class="bar">
        <span class="name" id="cur">—</span>

        <span class="grp">
          <button class="ib" id="prev" title="上一页（←）" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <span id="pinfo"></span>
          <button class="ib" id="next" title="下一页（→）" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </span>

        <span class="grp">
          <button class="ib" id="zoomout" title="缩小" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 12h12"/></svg>
          </button>
          <button class="ib" id="zoomin" title="放大" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 6v12"/><path d="M6 12h12"/></svg>
          </button>
        </span>

        <a class="dl" id="dl" href="#" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 11l4.5 4.5 4.5-4.5"/><path d="M5 19h14"/></svg>
          下载
        </a>
      </div>
      <div id="stage"><div class="hint">正在载入…</div></div>
    </section>
  </div>

  <footer>
    <span>田信忠 · 金融数据分析 / 行业研究</span>
    <span class="kbd">← → 翻页 · 点击目录切换材料 · 内容已隐去结论部分</span>
  </footer>
</div>

<script src="https://imxzt-papers.oss-cn-shenzhen.aliyuncs.com/pdfjs/pdf.min.js"></script>
<script>
/* 数据源策略：OSS 国内节点快（首选）→ 失败回退 Pages 同源（备用）。
   注意 OSS 默认域名对 PDF 强制下载（Content-Disposition: attachment），
   但 pdf.js 用 fetch/XHR 取字节流，不受该头影响，故可正常页内渲染。 */
const OSS   = "https://imxzt-papers.oss-cn-shenzhen.aliyuncs.com/";
const PAGES = "https://imxzt.github.io/research-papers/";
const PAPERS = [
  { g:"校内合作" },
  { t:"数字普惠金融提高了农村居民收入吗？——来自 285 个城市的经验证据",
    m:"田信忠 · 2011–2022 年中国 285 个地级及以上城市面板数据 · 投稿 Agriculture 等期刊 · 研究生学术论坛一等奖",
    f:"01-digital-financial-inclusion-and-rural-income.pdf" },
  { t:"留华筑梦，择业有因——东盟来华留学生就业意愿及其影响因素研究",
    m:"田信忠等 · 191 份东盟来华留学生有效问卷 · 全国大学生市场调查与分析大赛全国总决赛三等奖",
    f:"08-market-survey-asean-students-employment-intention.pdf" },
  { t:"贸易协定深度对绿色全要素生产率的影响研究——来自 RCEP 国家的证据",
    m:"李政、田信忠、张皓彦 · 1991–2022 年 RCEP 成员国 · 区域贸易协定深度与绿色 TFP",
    f:"04-rta-depth-and-green-tfp.pdf" },
  { t:"数字贸易协议对全球价值链前向参与度的影响研究——来自 RCEP 国家的证据",
    m:"方冬莉、田信忠、张皓彦、苏梦颖 · 广西民族大学经济学院 · 投稿《国际贸易问题》等期刊",
    f:"02-digital-trade-agreements-and-gvc-forward-participation.pdf" },
  { t:"Extreme Weather Shocks and Rural Household Income in China: The Buffering Role of Digital Financial Inclusion and Spatial Spillover Effects",
    m:"极端天气冲击与农村收入——数字金融缓冲作用 · 293 个地级市 · 英文工作论文",
    f:"03-extreme-weather-shocks-rural-income-and-digital-finance.pdf" },
  { t:"区域贸易协议深度对中国供应链转移的影响研究——基于 RCEP 成员国的实证分析",
    m:"田信忠等 · 2000–2022 年 14 个 RCEP 成员国 · 增加值分解框架 · 工作论文",
    f:"05-rta-depth-and-china-supply-chain-shift.pdf" },
  { t:"流通基础设施升级对居民消费活力的影响——基于国家骨干冷链物流基地设立的准自然实验",
    m:"田信忠等 · 337 个地级市 × 1998–2025 年面板 · 多期 DID + PSM · 中间成果",
    f:"06-cold-chain-infrastructure-and-consumption-vitality.pdf" },
  { g:"跨校合作" },
  { t:"Green Finance and the Quality of Green Innovation: A Quasi-Natural Experiment from China's Pilot Zones",
    m:"与天津商业大学合作 · A 股上市公司面板 · 多期 DID + PSM-DID · 合作论文",
    f:"07-green-finance-and-green-innovation-quality.pdf" },
  { t:"广西—东盟合作发展年度报告（2024 年）马来西亚篇",
    m:"广西大学中国—东盟研究院组织编著 · 马来西亚章节独立完成 · 已出版",
    f:"11-guangxi-asean-annual-report-2024-malaysia.pdf" },
  { g:"课题参与" },
  { t:"RCEP 框架下数字贸易规则对区域价值链前向参与度的提升路径与对策研究",
    m:"广西民族大学研究生教育创新计划项目申报书 · 校级立项 gxmzu-chxs2025246",
    f:"09-rcep-digital-trade-rules-and-gvc-upgrading.pdf" },
  { g:"会议实践" },
  { t:"气候政策不确定性对制造业企业全要素生产率的影响",
    m:"苏梦颖、李政、田信忠 · 第十一期碳中和与气候金融高端论坛（长沙）· 合作论文",
    f:"10-climate-policy-uncertainty-and-manufacturing-tfp.pdf" },
  { t:"中南财经政法大学经济贸易学院 2026 年暑期学校《数智时代的经济学研究：道与器》结业证书",
    m:"2026 年 7 月 7–12 日 · 武汉 · 达到结业要求，准予结业",
    f:"12-cqufe-summer-school-certificate.pdf" }
];
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = OSS + "pdfjs/pdf.worker.min.js";

const ARROW = '<svg class="go" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const listEl = document.getElementById('list'), stage = document.getElementById('stage');
const curEl  = document.getElementById('cur'),  pinfo = document.getElementById('pinfo');
const cntEl  = document.getElementById('cnt'),  btnDl = document.getElementById('dl');
const btnPrev = document.getElementById('prev'), btnNext = document.getElementById('next');
const btnIn   = document.getElementById('zoomin'), btnOut = document.getElementById('zoomout');
let doc = null, page = 1, idx = -1, busy = false, zoom = 1;
const cache = new Map();          // 已加载文档缓存，切换回来秒开
const prefetching = new Set();    // 预取去重

/* 预取相邻材料：命中缓存后切换是瞬时的 */
function prefetch(i){
  const p = PAPERS[i];
  if (!p || p.g || cache.has(i) || prefetching.has(i)) return;
  prefetching.add(i);
  pdfjsLib.getDocument({ url: OSS + p.f }).promise
    .then(d => cache.set(i, d))
    .catch(() => {})
    .finally(() => prefetching.delete(i));
}

let total = 0;
PAPERS.forEach((p, i) => {
  const li = document.createElement('li');
  if (p.g) {
    li.className = 'ghead'; li.textContent = p.g;
  } else {
    total++;
    li.className = 'paper'; li.dataset.idx = i;
    li.innerHTML = '<div class="t">' + p.t + '</div><div class="m">' + p.m + '</div>' + ARROW;
    li.onclick = () => open(i);
  }
  listEl.appendChild(li);
});
cntEl.textContent = total + ' 篇';

function mark(){
  listEl.querySelectorAll('li.paper').forEach(el => el.classList.toggle('on', +el.dataset.idx === idx));
}
function setNav(){
  pinfo.textContent = doc ? page + ' / ' + doc.numPages : '';
  btnPrev.disabled = !doc || page <= 1;
  btnNext.disabled = !doc || page >= doc.numPages;
  btnIn.disabled = btnOut.disabled = !doc;
}

async function open(i){
  idx = i; mark(); zoom = 1;
  const p = PAPERS[i];
  curEl.textContent = p.t;
  btnDl.href = OSS + p.f;                       // 下载走 OSS（国内快）
  doc = null; setNav();

  // 命中缓存 → 立即渲染，无等待
  if (cache.has(i)) {
    doc = cache.get(i);
    page = 1;
    await render();
    prefetch(i + 1); prefetch(i - 1);
    return;
  }

  stage.innerHTML = '<div class="hint">正在载入…</div>';
  let err = null;
  // 首选 OSS（快）；失败回退 Pages 同源；再失败回退 Pages 绝对地址
  const urls = [OSS + p.f, p.f, PAGES + p.f];
  for (const u of urls) {
    try {
      doc = await pdfjsLib.getDocument({
        url: u,
        // 首屏进度：先到先渲染，不等整份下载完
        disableAutoFetch: true,
        disableStream: false
      }).promise;
      break;
    } catch (e) { err = e; doc = null; }
  }
  if (!doc) { stage.innerHTML = '<div class="hint">载入失败：' + (err && err.message || err) + '</div>'; return; }
  cache.set(i, doc);
  page = 1;
  await render();
  prefetch(i + 1); prefetch(i - 1);
  if (window.matchMedia('(max-width:960px)').matches) {
    document.querySelector('.viewer').scrollIntoView({ behavior:'smooth', block:'start' });
  }
}

async function render(){
  if (!doc || busy) return;
  busy = true;
  try {
    const pg = await doc.getPage(page);
    const v1 = pg.getViewport({ scale:1 });
    const maxW = Math.min(stage.clientWidth - 34, 1000);
    const vp = pg.getViewport({ scale: (maxW / v1.width) * zoom });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cv = document.createElement('canvas');
    cv.width  = Math.floor(vp.width  * dpr);
    cv.height = Math.floor(vp.height * dpr);
    cv.style.width  = Math.floor(vp.width)  + 'px';
    cv.style.height = Math.floor(vp.height) + 'px';
    stage.innerHTML = ''; stage.appendChild(cv);
    stage.style.textAlign = zoom > 1 ? 'left' : 'center';
    await pg.render({
      canvasContext: cv.getContext('2d'),
      viewport: vp,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : undefined
    }).promise;
    setNav();
  } finally { busy = false; }
}

btnPrev.onclick = () => { if (doc && page > 1) { page--; render(); } };
btnNext.onclick = () => { if (doc && page < doc.numPages) { page++; render(); } };
btnIn.onclick   = () => { if (doc && zoom < 2.5) { zoom += 0.25; render(); } };
btnOut.onclick  = () => { if (doc && zoom > 0.5) { zoom -= 0.25; render(); } };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft')  btnPrev.click();
  if (e.key === 'ArrowRight') btnNext.click();
});
window.addEventListener('resize', () => { if (doc && !busy) render(); });

if (window.pdfjsLib) open(PAPERS.findIndex(p => !p.g));
else stage.innerHTML = '<div class="hint">PDF 组件加载失败（pdf.js）。</div>';
</script>
</body>
</html>
